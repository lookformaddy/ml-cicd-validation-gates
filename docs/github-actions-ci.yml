# GitHub Actions CI for ml-cicd-validation-gates.
# NOTE: lives under docs/ as a template. Move to .github/workflows/ci.yml to activate.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
      - run: pytest -q
      - run: python examples/run_demo.py > /dev/null
      - run: docker build -t ml-cicd-validation-gates:ci .
